<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#5c4ee5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Interactive 8th-grade math practice: balance equations, moving terms across the = sign, unit conversions, percents, and word problems — learn by doing, with animations." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Math Quest</title>
</head>
<body data-screen="home">
  <section id="scr-home" class="screen active" aria-label="Home"></section>
  <section id="scr-world" class="screen" aria-label="World"></section>
  <section id="scr-play" class="screen play" aria-label="Play"></section>
  <section id="scr-end" class="screen" aria-label="Round results"></section>
  <section id="scr-parent" class="screen" aria-label="Progress"></section>
  <section id="blitzView" class="screen blitz-screen" aria-label="Lightning Round"></section>

  <div id="explainer" class="ex-modal" hidden data-voice="off">
    <div class="ex-dialog" role="dialog" aria-modal="true" aria-labelledby="exSceneTitle">
      <div class="ex-top"><span class="ex-title"></span><div><button type="button" class="ex-voice" data-ex="voice">🔈 Read aloud</button><button type="button" class="ex-close" data-ex="close" aria-label="Close lesson">✕</button></div></div>
      <h2 class="ex-scene-title" id="exSceneTitle"></h2>
      <div class="ex-stage"></div>
      <p class="ex-say"></p>
      <div class="ex-nav"><button type="button" class="ghost-btn" data-ex="prev">◀</button><button type="button" class="ghost-btn" data-ex="replay">↺ Replay</button><div class="ex-dots"></div><button type="button" class="big-btn" data-ex="next">Next ▶</button></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="celebration" class="celebration" aria-hidden="true"></div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/act-solve.js"></script>
  <script src="js/act-percent.js"></script>
  <script src="js/act-convert.js"></script>
  <script src="js/act-words.js"></script>
  <script src="js/explainers.js"></script>
  <script src="js/blitz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
